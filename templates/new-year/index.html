<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>元旦联欢会</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #7a0e0e 0%, #b71c1c 50%, #f44336 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 600px;
            min-width: 800px;
        }
        
        /* 横屏容器 */
        .container {
            width: 90%;
            max-width: 1200px;
            height: 80%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            position: relative;
        }
        
        /* 返回主页按钮 */
        .home-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        
        .home-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        
        .home-btn i {
            font-size: 24px;
            color: #fff;
        }
        
        /* 标题样式 */
        .title {
            text-align: center;
            margin-top: 30px;
            position: relative;
            color: #f8f0e5;
        }
        
        .main-title {
            font-size: 5.5rem;
            font-weight: bold;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            letter-spacing: 8px;
            margin-bottom: 10px;
            background: linear-gradient(to bottom, #ffffff, #f0f0f0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        .subtitle {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 3px;
            opacity: 0.95;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        /* 按钮区域 */
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            width: 100%;
            max-width: 1000px;
        }
        
        .button {
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px);
            padding: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
        
        .button:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-10px);
            border-color: #fff;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }
        
        .button i {
            font-size: 50px;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .button-text {
            font-size: 20px;
            font-weight: 500;
            text-align: center;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        /* 底部装饰 */
        .footer {
            margin-top: 30px;
            font-size: 16px;
            opacity: 0.9;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        /* 装饰元素 */
        .decoration {
            position: absolute;
            z-index: -1;
        }
        
        .decoration-1 {
            top: 10%;
            left: 5%;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        
        .decoration-2 {
            bottom: 15%;
            right: 7%;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            animation: float 8s ease-in-out infinite reverse;
        }
        
        .decoration-3 {
            top: 20%;
            right: 10%;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            transform: rotate(45deg);
            animation: pulse 4s ease-in-out infinite;
        }
        
        /* 动画 */
        @keyframes glow {
            from {
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.7), 0 0 20px rgba(255, 255, 255, 0.5);
            }
            to {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 30px rgba(255, 255, 255, 0.7), 0 0 40px rgba(255, 255, 255, 0.5);
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: rotate(45deg) scale(1);
            }
            50% {
                transform: rotate(45deg) scale(1.1);
            }
        }
        
        /* 响应式调整 */
        @media (max-width: 1000px) {
            .main-title {
                font-size: 4rem;
            }
            
            .button {
                width: 150px;
                height: 150px;
            }
            
            .button i {
                font-size: 40px;
            }
            
            .button-text {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 返回主页按钮 -->
        <div class="home-btn" id="homeBtn">
            <i class="fas fa-home"></i>
        </div>
        
        <!-- 装饰元素 -->
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>
        <div class="decoration decoration-3"></div>
        
        <!-- 标题区域 -->
        <div class="title">
            <h1 class="main-title">元旦联欢会</h1>
            <p class="subtitle">New Year's Celebration Party</p>
        </div>
        
        <!-- 按钮区域 -->
        <!-- 按钮区域 -->
        <div class="buttons-container">
            <!-- 按钮1 - 节目单 -->
            <div class="button" data-url="#">
                <i class="fas fa-list-ol"></i>
                <div class="button-text">节目单（暂无）</div>
            </div>
            
            <!-- 按钮2 - 你比划我猜游戏 -->
            <div class="button" data-url="/new-year/charades">
                <i class="fas fa-theater-masks"></i>
                <div class="button-text">你比划我猜游戏</div>
            </div>
            
            <!-- 按钮3 - 无声传话游戏 -->
            <div class="button" data-url="/new-year/whisper-game">
                <i class="fas fa-comments"></i>
                <div class="button-text">无声传话游戏</div>
            </div>
        </div>
        
        <!-- 底部信息 -->
        <div class="footer">
            <p>© 2025 人大附中三亚学校高一(4)班元旦联欢会筹备组 | 祝大家元旦快乐！</p>
        </div>
    </div>

    <script>
        // 按钮点击事件处理
        document.getElementById('homeBtn').addEventListener('click', function() {
            window.location.href = "/";
        });
        
        // 为所有按钮添加点击事件监听器
        document.querySelectorAll('.button').forEach(button => {
            button.addEventListener('click', function() {
                const url = this.getAttribute('data-url');
                if (url) {
                    window.location.href = url;
                }
            });
        });
        
        // 添加键盘快捷键支持
        document.addEventListener('keydown', function(event) {
            // ESC键返回主页
            if (event.key === 'Escape') {
                document.getElementById('homeBtn').click();
            }
            
            // 数字键对应按钮（1-3）
            if (event.key >= '1' && event.key <= '3') {
                const buttons = document.querySelectorAll('.button');
                const index = parseInt(event.key) - 1;
                if (buttons[index]) {
                    buttons[index].click();
                }
            }
        });
        
        // 添加页面加载完成后的动画效果
        window.addEventListener('load', function() {
            document.querySelector('.container').style.opacity = '0';
            document.querySelector('.container').style.transform = 'translateY(20px)';
            
            setTimeout(function() {
                document.querySelector('.container').style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                document.querySelector('.container').style.opacity = '1';
                document.querySelector('.container').style.transform = 'translateY(0)';
            }, 300);
        });
    </script>
</body>
</html>
